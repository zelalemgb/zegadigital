<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Zega Digital — Program Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1a1d29; --muted: #6b7280;
    --line: #e6e8ec; --brand: #345aa0; --brand-soft: #eaf0fb;
    --good: #16a34a; --warn: #d97706; --bad: #dc2626; --track: #eef0f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 18px 24px; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #fafbfc; }
  .range { display: inline-flex; gap: 6px; margin-right: 10px; }
  .range button { padding: 8px 12px; }
  .range button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .range button.active:hover { background: var(--ink); }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px;
  }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px; }
  .kpi .foot { color: var(--muted); font-size: 12px; margin-top: 2px; }
  section { margin-bottom: 24px; }
  section > h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 12px; }
  .two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
  .row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 14px; }
  .row .name { width: 150px; flex: none; color: var(--ink); }
  .row .num { width: 46px; flex: none; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 10px; background: var(--track); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
  /* Each column fills the 90px track so the inner bar's % height has a definite
     parent to resolve against; the bar sits at the bottom and grows upward. */
  .spark > div { flex: 1; height: 100%; display: flex; align-items: flex-end; background: var(--brand-soft); border-radius: 3px 3px 0 0; }
  .spark > div > span { display: block; width: 100%; min-height: 2px; background: var(--brand); border-radius: 3px 3px 0 0; }
  .spark-labels { display: flex; gap: 3px; margin-top: 6px; }
  .spark-labels > div { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
    position: sticky; top: 0; background: var(--card); cursor: pointer; user-select: none; }
  th:hover { color: var(--ink); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { max-height: 460px; overflow: auto; border-radius: 12px; }
  .minibar { display: inline-flex; align-items: center; gap: 7px; }
  .minibar .bar { width: 80px; height: 8px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill.youth { background: #e0f2fe; color: #0369a1; }
  .pill.adult { background: #f3e8ff; color: #7e22ce; }
  .pill.lang { background: #f1f5f9; color: #475569; }
  .acc-good { color: var(--good); font-weight: 600; }
  .acc-warn { color: var(--warn); font-weight: 600; }
  .acc-bad  { color: var(--bad);  font-weight: 600; }
  .gain-pos { color: var(--good); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px 18px; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Zega Digital <span class="muted">· Program Dashboard</span></h1>
    <div class="sub" id="asof">Loading…</div>
  </div>
  <div class="spacer"></div>
  <div class="range" id="range">
    <button data-r="all" class="active">All</button>
    <button data-r="today">Today</button>
    <button data-r="week">1 week</button>
    <button data-r="month">1 month</button>
  </div>
  <button id="refresh">↻ Refresh</button>
  <button id="signout">↪ Sign out</button>
</header>
<main id="app"><div class="empty">Loading analytics…</div></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const pct = (n) => (n == null ? "—" : n + "%");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Thousands separators for plain numbers; strings (e.g. "100%", "—") pass through.
const fmt = (n) => (Number.isFinite(n) ? n.toLocaleString("en-US") : n);

function bar(value, max, cls = "") {
  const w = max > 0 ? Math.round((value / max) * 100) : 0;
  return `<div class="bar ${cls}"><span style="width:${w}%"></span></div>`;
}
function accClass(a) { return a == null ? "muted" : a >= 80 ? "acc-good" : a >= 60 ? "acc-warn" : "acc-bad"; }

function kpi(label, value, foot = "") {
  return `<div class="card kpi"><div class="label">${label}</div><div class="value">${fmt(value)}</div>${foot ? `<div class="foot">${foot}</div>` : ""}</div>`;
}

function render(data) {
  const s = data.summary, lessons = data.lessons, learners = data.learners;
  const app = $("#app");
  const RANGE_LABEL = { all: "All time", today: "Today", week: "Last 7 days", month: "Last 30 days" };
  const rLabel = RANGE_LABEL[s.range] || "All time";
  $("#asof").textContent = "As of " + s.generatedFor + " · " + rLabel + " · " + fmt(s.reach.users) + (s.windowed ? " new learners" : " learners");

  // Language split (derived from roster)
  const langCount = {};
  for (const l of learners) langCount[l.lang] = (langCount[l.lang] || 0) + 1;

  const funnelMax = s.funnel[0].count || 1;
  const dayMax = Math.max(1, ...s.retention.activityByDay.map((d) => d.u));
  const levelMax = Math.max(1, ...s.xp.byLevel.map((l) => l.count));
  const g = s.learningGain;
  const segLabel = Object.fromEntries(((s.segments && s.segments.meta) || []).map((m) => [m.key, m.label]));
  const riskColor = (r) => (r >= 55 ? "#c0392b" : r >= 30 ? "#d98c00" : "#1f8f57");
  const comp = s.completion || { counts: {}, meta: [], tracked: 0, atLeast50: 0 };
  const compMax = Math.max(1, ...comp.meta.map((b) => comp.counts[b.key] || 0));
  const tracks = s.tracks || [];
  const byLang = s.byLang || [];
  const modEng = s.moduleEngagement || [];
  const modMax = Math.max(1, ...modEng.map((m) => m.completed));
  const trackLabel = { youth: "Youth", adult: "Adult" };
  // When a range is active, tag snapshot cards that stay all-time.
  const allTimeTag = s.windowed ? ` <span class="muted" style="font-weight:400;text-transform:none;font-size:11px">· all-time</span>` : "";

  app.innerHTML = `
    <div class="grid kpis">
      ${kpi(s.windowed ? "New learners" : "Learners", s.reach.users, fmt(s.reach.pickedTrack) + " picked a track")}
      ${kpi("Active today", s.reach.activeToday, fmt(s.reach.distinctActive) + (s.windowed ? " active in period" : " ever active"))}
      ${kpi("Lessons completed", s.reach.lessonsCompleted, fmt(s.reach.startedLesson) + " learners started ≥1")}
      ${kpi("Track completions", s.reach.completedTrack, "finished a full track")}
      ${kpi("Certificates earned", (s.certificates ? s.certificates.learners : 0), (s.certificates && s.certificates.byTrack && s.certificates.byTrack.length ? s.certificates.byTrack.map((t) => t.track + ": " + fmt(t.c)).join(" · ") : "completed + passed the quiz"))}
      ${kpi("Quiz pass rate", pct(s.quizzes.passRate), fmt(s.quizzes.attempts) + " attempts")}
      ${kpi("Avg learning gain" + (s.windowed ? " ¹" : ""), g.avgGainPoints == null ? "—" : "+" + g.avgGainPoints + " pts", fmt(g.bothTaken) + " took both tests" + (s.windowed ? " · all-time" : ""))}
    </div>

    <section class="grid two">
      <div class="card">
        <h2>Engagement funnel</h2>
        ${s.funnel.map((f) => `
          <div class="row"><div class="name">${esc(f.stage)}</div>${bar(f.count, funnelMax)}<div class="num">${fmt(f.count)}</div></div>
        `).join("")}
      </div>
      <div class="card">
        <h2>Active learners · last 14 days</h2>
        <div class="spark">
          ${s.retention.activityByDay.map((d) => `<div title="${d.d}: ${fmt(d.u)} active, ${fmt(d.n)} events"><span style="height:${Math.round((d.u / dayMax) * 100)}%"></span></div>`).join("")}
        </div>
        <div class="spark-labels">
          ${s.retention.activityByDay.map((d, i) => `<div>${i % 2 === 0 ? d.d.slice(5) : ""}</div>`).join("")}
        </div>
      </div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>Learner segments${allTimeTag}</h2>
        <div style="color:#5c6b86;font-size:13px;margin:-4px 0 12px">Every learner in exactly one bucket — the base for targeted reminders &amp; at-risk outreach.</div>
        ${(s.segments ? s.segments.meta : []).map((m) => {
          const c = (s.segments.counts && s.segments.counts[m.key]) || 0;
          return `<div class="row"><div class="name" title="${esc(m.hint)}">${esc(m.label)}</div>${bar(c, s.reach.users || 1)}<div class="num">${fmt(c)}</div></div>`;
        }).join("")}
      </div>
      <div class="card">
        <h2>At-risk learners${allTimeTag}</h2>
        <div style="color:#5c6b86;font-size:13px;margin:-4px 0 12px">Likely to drop off before certifying — outreach targets.</div>
        ${s.atRisk ? [["High risk","high","#c0392b"],["Medium risk","medium","#d98c00"],["Low risk","low","#1f8f57"]].map(([label,key,col]) => {
          const c = s.atRisk.bands[key] || 0;
          return `<div class="row"><div class="name"><span style="color:${col}">●</span> ${label}</div>${bar(c, s.reach.users || 1)}<div class="num">${fmt(c)}</div></div>`;
        }).join("") : ""}
        <div class="row" style="border-top:1px solid #e4e8f1;margin-top:8px;padding-top:10px">
          <div class="name"><b>🎯 Worth saving</b> <span style="color:#5c6b86">— at-risk with real progress</span></div>
          <div class="num"><b>${fmt(s.atRisk ? s.atRisk.savable : 0)}</b></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Completion depth <span class="muted" style="text-transform:none;font-weight:400">— learners 50%+ through their track, by how far they've got</span>${allTimeTag}</h2>
      <div style="color:#5c6b86;font-size:13px;margin:-4px 0 12px">Where near-finishers cluster. “Completed” has done every lesson; “90–99%” is one lesson from done — the prime close-the-gap targets.</div>
      ${comp.meta.map((b) => {
        const c = comp.counts[b.key] || 0;
        return `<div class="row"><div class="name">${esc(b.label)}</div>${bar(c, compMax)}<div class="num">${fmt(c)}</div></div>`;
      }).join("")}
      <div class="row" style="border-top:1px solid #e4e8f1;margin-top:8px;padding-top:10px">
        <div class="name"><b>≥50% complete</b> <span style="color:#5c6b86">— of ${fmt(comp.tracked)} learners who picked a track</span></div>
        <div class="num"><b>${fmt(comp.atLeast50)}</b></div>
      </div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>Youth vs Adult</h2>
        <div style="color:#5c6b86;font-size:13px;margin:-4px 0 12px">Reach and progress by track — the full funnel, not just certificates.</div>
        <div class="scroll">
          <table>
            <thead><tr><th>Track</th><th class="num">Learners</th><th class="num">Started</th><th class="num">Completed</th><th class="num">Certified</th><th class="num">Avg&nbsp;%</th></tr></thead>
            <tbody>
            ${tracks.map((t) => `
              <tr>
                <td><span class="pill ${t.track}">${esc(trackLabel[t.track] || t.track)}</span></td>
                <td class="num">${fmt(t.learners)}</td>
                <td class="num">${fmt(t.started)}</td>
                <td class="num">${fmt(t.completed)}</td>
                <td class="num">${fmt(t.certified)}</td>
                <td class="num">${pct(t.avgPct)}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div style="color:#5c6b86;font-size:12px;margin-top:8px">Started = completed ≥1 lesson · Completed = finished every lesson in the track · Avg % = mean completion across that track's learners.</div>
      </div>
      <div class="card">
        <h2>Language &amp; completion</h2>
        <div style="color:#5c6b86;font-size:13px;margin:-4px 0 12px">Language mix, and how far each language group gets.</div>
        <div class="scroll">
          <table>
            <thead><tr><th>Language</th><th class="num">Learners</th><th class="num">Completed ≥1</th><th class="num">Finished track</th></tr></thead>
            <tbody>
            ${byLang.map((l) => `
              <tr>
                <td>${esc((l.lang || "").toUpperCase() || "—")}</td>
                <td class="num">${fmt(l.learners)}</td>
                <td class="num">${fmt(l.completedAny)}</td>
                <td class="num">${fmt(l.trackCompleted)}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div style="color:#5c6b86;font-size:12px;margin-top:8px">“Completed ≥1” is the base for the completion-language ratio; “Finished track” did every lesson.</div>
      </div>
    </section>

    <section class="card">
      <h2>Module engagement <span class="muted" style="text-transform:none;font-weight:400">— lessons completed within each module ${s.windowed ? "in the selected period" : "(all-time)"}</span></h2>
      <div style="color:#5c6b86;font-size:13px;margin:-4px 0 12px">Modules ranked by lessons completed — the revealed preference of whoever's working through the programme.</div>
      ${modEng.map((m) => `<div class="row"><div class="name"><span class="pill ${m.track}">${esc(trackLabel[m.track] || m.track)}</span> ${esc(m.module)}</div>${bar(m.completed, modMax)}<div class="num">${fmt(m.completed)}</div></div>`).join("")}
      ${modEng.length ? "" : '<div class="muted">No in-progress engagement yet.</div>'}
    </section>

    <section class="grid two">
      <div class="card">
        <h2>Skill levels${allTimeTag}</h2>
        ${s.xp.byLevel.map((l) => `<div class="row"><div class="name">${esc(l.name)}</div>${bar(l.count, levelMax)}<div class="num">${fmt(l.count)}</div></div>`).join("")}
      </div>
      <div class="card">
        <h2>Streaks &amp; reminders</h2>
        <div class="row"><div class="name">Avg streak</div><div class="num" style="width:auto">${s.streaks.avg} days</div></div>
        <div class="row"><div class="name">Longest streak</div><div class="num" style="width:auto">${s.streaks.max} days</div></div>
        <div class="row"><div class="name">Opted into reminders</div><div class="num" style="width:auto">${fmt(s.reminders.optedIn)}</div></div>
        <div class="row"><div class="name">Nudges sent</div><div class="num" style="width:auto">${fmt(s.reminders.nudgesSent)}</div></div>
        <div class="row"><div class="name">Check accuracy</div><div class="num" style="width:auto">${pct(s.checks.accuracy)} <span class="muted">(${fmt(s.checks.answered)})</span></div></div>
        <div class="row"><div class="name">Language split</div><div class="num" style="width:auto">${Object.entries(langCount).map(([k, v]) => `${k.toUpperCase()} ${fmt(v)}`).join(" · ") || "—"}</div></div>
      </div>
    </section>

    <section class="card">
      <h2>Lesson performance <span class="muted" style="text-transform:none;font-weight:400">— completions show drop-off; low check accuracy flags hard lessons</span></h2>
      <div class="scroll">
        <table id="lessonTable">
          <thead><tr>
            <th data-k="track">Track</th><th data-k="module">Module</th><th data-k="title">Lesson</th>
            <th class="num" data-k="completed">Completed</th><th class="num" data-k="checkAccuracy">Check acc.</th>
          </tr></thead>
          <tbody>
          ${lessons.map((l) => `
            <tr>
              <td><span class="pill ${l.track}">${l.track}</span></td>
              <td class="muted">${esc(l.module)}</td>
              <td>${esc(l.title)}</td>
              <td class="num"><span class="minibar">${bar(l.completed, Math.max(1, ...lessons.map((x) => x.completed)))}<b>${fmt(l.completed)}</b></span></td>
              <td class="num ${accClass(l.checkAccuracy)}">${l.checkAccuracy == null ? "—" : l.checkAccuracy + "%"}<span class="muted"> ${l.checkAnswered ? "(" + fmt(l.checkAnswered) + ")" : ""}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Learners <span class="muted" style="text-transform:none;font-weight:400">— ${learners.length} total, most recently active first</span></h2>
      <div class="scroll">
        <table id="learnerTable">
          <thead><tr>
            <th data-k="id">Learner</th><th data-k="lang">Lang</th><th data-k="track">Track</th>
            <th class="num" data-k="pct">Progress</th><th class="num" data-k="xp">XP</th><th data-k="level">Level</th>
            <th class="num" data-k="streak">Streak</th><th class="num" data-k="quizPasses">Quiz</th>
            <th data-k="segment">Segment</th><th class="num" data-k="risk">Risk</th>
            <th class="num" data-k="gain">Baseline→End</th><th data-k="lastActive">Last active</th>
          </tr></thead>
          <tbody>
          ${learners.map((l) => `
            <tr>
              <td><code>${esc(l.id)}</code></td>
              <td><span class="pill lang">${l.lang.toUpperCase()}</span></td>
              <td>${l.track ? `<span class="pill ${l.track}">${l.track}</span>` : '<span class="muted">—</span>'}</td>
              <td class="num"><span class="minibar">${bar(l.lessonsDone, l.lessonsTotal || 1)}<b>${l.lessonsDone}/${l.lessonsTotal || "—"}</b></span></td>
              <td class="num">${fmt(l.xp)}</td>
              <td>${esc(l.level)}</td>
              <td class="num">${l.streak || "—"}</td>
              <td class="num">${l.quizAttempts ? l.quizPasses + "/" + l.quizAttempts : "—"}</td>
              <td>${segLabel[l.segment] || l.segment || "—"}</td>
              <td class="num"><b style="color:${riskColor(l.risk || 0)}">${l.risk == null ? "—" : l.risk}</b></td>
              <td class="num">${l.baselinePct == null && l.endlinePct == null ? '<span class="muted">—</span>'
                  : `${l.baselinePct == null ? "—" : l.baselinePct + "%"} → ${l.endlinePct == null ? "—" : l.endlinePct + "%"}${(l.baselinePct != null && l.endlinePct != null) ? ` <span class="gain-pos">(${l.endlinePct - l.baselinePct >= 0 ? "+" : ""}${l.endlinePct - l.baselinePct})</span>` : ""}`}</td>
              <td class="muted">${l.lastActive || "—"}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>
  `;
  if (!learners.length) app.innerHTML += `<div class="empty">No learners yet. Data appears here as people use the bot.</div>`;
  wireSort("lessonTable", lessons);
  wireSort("learnerTable", learners);
}

// Click a column header to sort that table (numeric desc / text asc).
function wireSort(tableId, dataRef) {
  const table = document.getElementById(tableId);
  if (!table) return;
  table.querySelectorAll("th[data-k]").forEach((th) => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      const tbody = table.querySelector("tbody");
      const rows = [...tbody.rows];
      const asc = th._asc = !th._asc;
      const val = (tr) => {
        const cell = tr.querySelector(`td:nth-child(${th.cellIndex + 1})`);
        const t = cell ? cell.textContent.trim() : "";
        const n = parseFloat(t.replace(/[^0-9.\-]/g, ""));
        return isNaN(n) || /[a-z]/i.test(t.replace(/pts|days/gi, "")) && !/^\d/.test(t) ? t.toLowerCase() : n;
      };
      rows.sort((a, b) => {
        const va = val(a), vb = val(b);
        if (typeof va === "number" && typeof vb === "number") return asc ? va - vb : vb - va;
        return asc ? String(va).localeCompare(vb) : String(vb).localeCompare(va);
      });
      rows.forEach((r) => tbody.appendChild(r));
    });
  });
}

let currentRange = "all";
async function load() {
  const app = $("#app");
  try {
    // Build the URL from origin (never includes userinfo) so the request works
    // even if the page was opened with credentials embedded in the address bar.
    const res = await fetch(location.origin + "/admin/api?range=" + encodeURIComponent(currentRange), { headers: { Accept: "application/json" } });
    if (res.status === 401) { location.href = "/admin/login"; return; } // session expired
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (e) {
    app.innerHTML = `<div class="err">Could not load analytics: ${esc(e.message)}. Try refreshing.</div>`;
  }
}
// Date-range picker: highlight the choice and reload for that window.
$("#range").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-r]");
  if (!btn) return;
  currentRange = btn.dataset.r;
  for (const b of $("#range").querySelectorAll("button")) b.classList.toggle("active", b === btn);
  load();
});
$("#refresh").addEventListener("click", load);

// Cookie session → logout is a real server round-trip that clears the cookie.
$("#signout").addEventListener("click", () => { location.href = "/admin/logout"; });

load();
</script>
</body>
